name: Ci Pipeline


on:
    push:
        branches: [ main]
    pull_request:
        branches: [ main ]

jobs:
    docker-build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Build Docker Image
              run: |
                docker build -t agent-demo:latest .
            
            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@master
              with:
                image-ref: agent-demo:latest
                format: 'table'
                
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_HUB_USERNAME }}
                password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
            
            - name: Push Docker Image to Docker Hub
              run: |
                docker tag agent-demo:latest ${{ secrets.DOCKER_HUB_USERNAME }}/agent-demo:latest
                docker tag agent-demo:latest ${{ secrets.DOCKER_HUB_USERNAME }}/agent-demo:${{ github.sha }}
                docker push ${{ secrets.DOCKER_HUB_USERNAME }}/agent-demo:latest
                docker push ${{ secrets.DOCKER_HUB_USERNAME }}/agent-demo:${{ github.sha }}
       